<section class="center"><div class="sportsbar" id="sportsbar"></div><div class="workspace"><div class="contenttop"><div class="subnav"><button class="active">Fulltime Result</button></div></div><div class="controls"><div class="searchwrap"><span>⌕</span><input id="search" class="search" placeholder="Search events, teams or competitions"></div><select id="market" class="market"><option>Fulltime Result</option></select><select id="leagueFilter" class="leaguefilter"><option value="">All competitions</option></select></div><main class="leftcontent" id="content"><div class="emptySlip">Loading events...</div></main></div></section>
<aside class="desktopSlip" id="betslip"><div id="slipHead" class="sliphead"><div class="sliptabs"><span id="slipcount" class="slipcount">0</span><button id="slipTab" class="active">Skedina</button></div><button id="slipClose" class="slipclose" aria-label="Close bet slip">×</button></div><div id="slipView"><div id="slipbody" class="slipbody"></div><div class="betfooter"><div class="betrow"><span>Selections</span><strong id="selCount">0</strong></div><div class="betrow"><span>Total odds</span><strong id="totalOdds">0.00</strong></div><div class="stakeBox"><label>Stake / Shuma</label><input id="stake" class="stakeInput" type="number" min="0.01" step="0.01" placeholder="0.00"><div class="quick"><button data-stake="5">€5</button><button data-stake="10">€10</button><button data-stake="20">€20</button><button data-stake="50">€50</button></div></div><div class="betrow"><span>Potential win</span><strong id="potential">0.00</strong></div><button id="place" class="place">Place Bet</button><div id="betMsg" class="notice">Log in to place a bet.</div></div></div><div id="staffView" class="staffView"></div></aside>
</div>

<div id="mobileSlipBackdrop" class="mobile-slip-backdrop"></div><button id="mobileSlipBar" class="mobile-slip-bar" type="button"><span id="mobileSlipCount" class="mcount">0</span><span class="mlabel">Skedina</span><strong id="mobileSlipOdds" class="modds">0.00</strong><span class="mclose">×</span></button>
<div id="authModal" class="modal"><div class="modalbox"><button class="modalClose" data-close="authModal">×</button><h2 id="authTitle">Log In</h2><p style="margin:-4px 0 12px;color:#777;font-size:12px">Një login për Qendrën, Operatorët, Adminët, Supermanagerët, Agentët dhe Userat.</p><form id="authForm" class="form"><input id="username" autocomplete="username" placeholder="Username" required><input id="password" type="password" autocomplete="current-password" placeholder="Password" required><div id="authMsg" class="adminMsg"></div><button id="authSubmit">Log In</button></form></div></div>
<div id="controlModal" class="modal"><div class="modalbox controlbox"><button class="modalClose" data-close="controlModal">×</button><h2 id="controlTitle">Control Center</h2><div id="controlApp"></div></div></div>
<div id="status" class="statusbar">Connecting...</div>
<script>
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
localStorage.removeItem('sportsbook_token');
let mode='home',timer=null,cache=[],selectedSport='soccer',query='',activeLeague='',lastOdds={},slip=[],pendingTicket=null,token=sessionStorage.getItem('sportsbook_token')||'',user=null,liveStream=null;
const liveClockState=new Map();
function clockToSeconds(v){const m=String(v??'').match(/^(\d{1,3}):(\d{2})$/);return m?Number(m[1])*60+Number(m[2]):null}
function secondsToClock(sec){sec=Math.max(0,Math.floor(sec));return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
function syncLiveClock(g){const raw=g.current_minute??g.game_time;const sec=clockToSeconds(raw);if(sec===null)return raw||'LIVE';const key=String(g.id);liveClockState.set(key,{base:sec,syncedAt:Date.now()});return secondsToClock(sec)}
function getLiveClock(g){const key=String(g.id);const raw=g.current_minute??g.game_time;const sec=clockToSeconds(raw);let st=liveClockState.get(key);if(!st&&sec!==null){st={base:sec,syncedAt:Date.now()};liveClockState.set(key,st)}if(!st)return raw||'LIVE';return secondsToClock(st.base+(Date.now()-st.syncedAt)/1000)}
function tickLiveClocks(){if(mode!=='live')return;document.querySelectorAll('[data-live-clock]').forEach(el=>{const g=cache.find(x=>String(x.id)===String(el.dataset.liveClock));const clock=el.querySelector('.live-clock-value');if(g&&clock)clock.textContent=getLiveClock(g)});}
function setHashForMode(m){const target=m==='live'?'#/InPlay':'#/';if(location.hash!==target)history.pushState({mode:m},'',target)}
function modeFromHash(){return /^#\/InPlay\/?$/i.test(location.hash)?'live':'home'}
const sports=[['★','Favourites','all'],['🔥','Popular','popular'],['⚽','Football','soccer'],['🎾','Tennis','tennis'],['🏈','American Football','american'],['⚾','Baseball','baseball'],['🏀','Basketball','basketball'],['🥊','Boxing','boxing'],['🏏','Cricket','cricket'],['🎯','Darts','darts'],['🎮','eSports','esports'],['🐕','Greyhounds','greyhounds']];
$('sportsbar').innerHTML=sports.map((s,i)=>`<button class="sport ${s[2]==='soccer'?'active':''}" data-sport="${s[2]}"><span class="ico">${s[0]}</span><span>${s[1]}</span></button>`).join('');
const sideSports=['Home','Futboll','Basketboll','Tenis','Futboll Amerikan','Badminton','Futsal','Volleyball','Darts','Cricket','Ping Pong','Aussie rules','Rugby','Box','Floorball','Handball'];
$('sideList').innerHTML=sideSports.map((x,i)=>`<div class="sideRow ${i===0?'home':''}"><span>${x}</span>${i===0?'':'<span class="star">☆</span>'}</div>`).join('');
$('sideSearch').oninput=e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('.sideRow').forEach(r=>r.style.display=r.textContent.toLowerCase().includes(q)?'flex':'none')};
function parseOdds(s){const o={1:null,X:null,2:null};if(typeof s!=='string')return o;for(const x of s.split(',')){const p=x.split('|');if(p.length>=4&&['1','X','2'].includes(p[2]))o[p[2]]=p[1]}return o}
function lock(v){return v==null||v===''||v==='-'||Number(v)===1}
function sportOf(g){const s=((g.sport_name||g.sport||g.category||'')+'').toLowerCase();if(/basket/.test(s))return'basketball';if(/tennis/.test(s))return'tennis';if(/baseball/.test(s))return'baseball';if(/american/.test(s))return'american';if(/ping|table tennis/.test(s))return'pingpong';return'soccer'}
function visible(g){const t=((g.name||'')+' '+(g.home_team||'')+' '+(g.away_team||'')+' '+(g.league||'')).toLowerCase();return(!query||t.includes(query))&&(!activeLeague||String(g.league||'')===activeLeague)&&(selectedSport==='all'||selectedSport==='popular'||sportOf(g)===selectedSport)}
function updateLeagues(data){const ls=[...new Set((data||[]).map(g=>g.league||'Competition'))].sort();$('leagueFilter').innerHTML='<option value="">All competitions</option>'+ls.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');$('leagueFilter').value=activeLeague}
function addPick(g,key,val){if(lock(val))return;const id=String(g.id)+'|'+key;const i=slip.findIndex(x=>x.id===id);if(i>=0)slip.splice(i,1);else{slip=slip.filter(x=>String(x.gameId)!==String(g.id));slip.push({id,gameId:g.id,key,odd:Number(val),league:g.league||'',home:g.home_team||g.name||'',away:g.away_team||'',eventTime:g.game_time||g.game_date||''})}renderSlip();render(cache,false)}
function refreshSlipState(){
  for(const p of slip){
    const g=cache.find(x=>String(x.id)===String(p.gameId));
    if(!g){p.invalid=true;p.invalidReason='Ndeshja nuk është më aktive.';continue}
    const o=parseOdds(g),v=o[p.key];
    if(lock(v)){p.invalid=true;p.invalidReason='Koeficienti është i kyçur / jo aktiv.';}
    else {p.invalid=false;p.invalidReason='';p.odd=Number(v);}
  }
}
function renderSlip(){
  // Keep the selected coefficient exactly as it was clicked (same behavior as the source Bet Slip).
  // Live/backend validation happens when the ticket is placed; a transient feed refresh must not
  // incorrectly turn a valid selected odd into LOCK in the slip.
  const validSlip=slip.filter(x=>!x.invalid && Number.isFinite(Number(x.odd)) && Number(x.odd)>1),total=validSlip.reduce((a,x)=>a*Number(x.odd),1),has=slip.length>0,hasInvalid=slip.some(x=>x.invalid);
  $('slipcount').textContent=slip.length;$('selCount').textContent=slip.length;$('totalOdds').textContent=validSlip.length?total.toFixed(2):'0.00';$('mobileSlipCount').textContent=slip.length;$('mobileSlipOdds').textContent=validSlip.length?total.toFixed(2):'0.00';$('mobileSlipBar').classList.toggle('show',has||!!pendingTicket);
  updatePotential();$('place').classList.toggle('enabled',has&&!!user&&!hasInvalid&&!pendingTicket);$('betMsg').textContent=pendingTicket?`Biletë #${pendingTicket.id} është në pritje të pranimit nga Qendra.`:(hasInvalid?'Një ose më shumë koeficientë janë kyçur. Hiqini nga skedina.':(user?'Enter stake and place your bet.':'Log in to place a bet.'));$('betMsg').className='notice'+(hasInvalid?' error':'');
  let body='';
  if(pendingTicket){body+=`<div class="pick ticketPending"><div class="leagueName">Biletë #${pendingTicket.id} • NË PRITJE</div>${pendingTicket.selections.map(p=>`<div class="game">${esc(p.home)}<br>${esc(p.away)} <span class="pickodd">${Number(p.odd).toFixed(2)}</span></div><div class="marketName">Fulltime Result • ${esc(p.key)}</div>`).join('')}<div class="reservedNote">Shuma €${Number(pendingTicket.stake).toFixed(2)} është rezervuar deri në pranimin ose anulimin e biletës.</div></div>`}
  if(has)body+=slip.map((p,i)=>`<div class="pick ${p.invalid?'invalidPick':''}"><button class="remove" data-remove="${i}">×</button><div class="leagueName">${esc(p.league)}</div><div class="game">${esc(p.home)}<br>${esc(p.away)} <span class="pickodd">${p.invalid?'LOCK':Number(p.odd).toFixed(2)}</span>${p.invalid?'<span class="invalidMark">✕</span>':''}</div><div class="marketName">Fulltime Result • ${esc(p.key)}${p.invalid?` · ${esc(p.invalidReason)}`:''}</div></div>`).join('');
  if(!body)body='<div class="emptySlip">Skedina është bosh.<br>Zgjidh një koeficient për ta shtuar.</div>';
  $('slipbody').innerHTML=body;document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{slip.splice(Number(b.dataset.remove),1);renderSlip();render(cache,false)})
}

function updatePotential(){const stake=Number($('stake').value||0),valid=slip.filter(x=>!x.invalid),odds=valid.reduce((a,x)=>a*x.odd,1);$('potential').textContent=stake>0&&valid.length?(stake*odds).toFixed(2):'0.00'}
function oddHtml(g,key,val,old){const l=lock(val),sel=slip.some(x=>String(x.gameId)===String(g.id)&&x.key===key);return `<button class="odd ${l?'locked':''} ${sel?'selected':''}" ${l?'disabled':''} data-game="${esc(g.id)}" data-key="${key}" data-odd="${esc(val??'')}">${l?'LOCK':Number(val).toFixed(2)}</button>`}
function render(data,reset=true){
  if(reset){cache=data||[];if(mode!=='live')updateLeagues(cache)}
  if(mode==='live') return renderLive(data);
  const arr=(data||[]).filter(visible).slice().sort((a,b)=>Number(a.order??0)-Number(b.order??0));
  if(!arr.length){$('content').innerHTML='<div class="emptySlip">No events found for this filter.</div>';return}
  const groups={};arr.forEach(g=>(groups[g.league||'Competition']??=[]).push(g));
  let html='<div class="dayhead">Ndeshjet Sot</div>';
  for(const [league,items] of Object.entries(groups)){
    html+=`<section class="league"><div class="leaguehead"><div class="name">${esc(league)}</div></div><div class="matchgrid">`;
    for(const g of items){
      const o=parseOdds(g.odd),time=g.game_time||g.game_date||'';
      html+=`<div class="match"><div class="matchinfo"><div class="teams"><div class="team">${esc(g.home_team||g.name||'')}</div><div class="team">${esc(g.away_team||'')}</div></div><div class="meta"><span>${esc(time)}</span><span>${esc(g.count_options?g.count_options+' >':'')}</span></div></div>${oddHtml(g,'1',o['1'])}${oddHtml(g,'X',o.X)}${oddHtml(g,'2',o['2'])}</div>`
    }
    html+='</div></section>'
  }
  $('content').innerHTML=html;
  bindOdds();
  document.querySelectorAll('.leaguehead').forEach(h=>h.onclick=()=>{activeLeague=activeLeague===h.querySelector('.name').textContent?'':h.querySelector('.name').textContent;$('leagueFilter').value=activeLeague;render(cache,false)})
}
function bindOdds(){
  document.querySelectorAll('.odd:not(.locked),.live-odd:not(.locked)').forEach(b=>b.onclick=()=>{
    const g=cache.find(x=>String(x.id)===String(b.dataset.game));
    if(g)addPick(g,b.dataset.key,b.dataset.odd)
  });
}
function renderLive(data){
  const arr=(data||[]).filter(g=>{
    const t=((g.name||'')+' '+(g.home_team||'')+' '+(g.away_team||'')+' '+(g.league||'')).toLowerCase();
    return (!query||t.includes(query)) && (selectedSport==='all'||selectedSport==='popular'||sportOf(g)===selectedSport);
  });
  let html=`<div class="live-mobile-dayhead"><span>Ndeshjet Sot</span><span>⌄</span></div><div class="live-toolbar"><label class="live-search"><span class="glass">⌕</span><input id="liveSearchInput" value="${esc(query)}" placeholder="Kerko Ndeshjen"></label><div class="live-result">Rezultat Final</div></div><div class="live-table">`;
  if(!arr.length){html+='<div class="live-empty">Nuk ka ndeshje live për momentin.</div></div>';$('content').innerHTML=html;const q=$('liveSearchInput');if(q)q.oninput=e=>{query=e.target.value.toLowerCase().trim();renderLive(cache)};return}
  const groups={};arr.forEach(g=>(groups[g.league||'Competition']??=[]).push(g));
  for(const [league,items] of Object.entries(groups)){
    html+=`<section class="live-league"><div class="live-league-head"><span class="lname">${esc(league)}</span><span>1</span><span>X</span><span>2</span></div>`;
    for(const g of items){
      const o=parseOdds(g.odd), result=String(g.result||'').split('-'), homeScore=result[0]||'', awayScore=result[1]||'';
      const time=getLiveClock(g);
      html+=`<div class="live-row"><div class="live-info"><span class="live-monitor">▱</span><div class="live-teams"><div class="live-team"><span class="live-shirt">♟</span>${esc(g.home_team||g.name||'')}</div><div class="live-team"><span class="live-shirt">♟</span>${esc(g.away_team||'')}</div><div class="live-time" data-live-clock="${esc(g.id)}"><span class="live-clock-value">${esc(time)}</span>${g.count_options?' <span>'+esc(g.count_options)+' ></span>':''}</div></div><div class="live-score"><div>${esc(homeScore)}</div><div>${esc(awayScore)}</div></div></div>${liveOddHtml(g,'1',o['1'])}${liveOddHtml(g,'X',o.X)}${liveOddHtml(g,'2',o['2'])}</div>`
    }
    html+='</section>';
  }
  html+='</div>';
  $('content').innerHTML=html;
  const q=$('liveSearchInput');if(q)q.oninput=e=>{query=e.target.value.toLowerCase().trim();renderLive(cache)};
  bindOdds();
}
function liveOddHtml(g,key,val){const l=lock(val),sel=slip.some(x=>String(x.gameId)===String(g.id)&&x.key===key);return `<button class="live-odd ${l?'locked':''} ${sel?'selected':''}" ${l?'disabled':''} data-game="${esc(g.id)}" data-key="${key}" data-odd="${esc(val??'')}">${l?'':Number(val).toFixed(2)}</button>`}

async function load(){try{const r=await fetch(mode==='live'?'/api/livegames?ts='+Date.now():'/api/prematch?ts='+Date.now());if(!r.ok)throw Error('HTTP '+r.status);const d=await SportsbookApi.readJson(r);render(Array.isArray(d)?d:[]);renderSlip();if(mode!=='live')$('status').textContent='PREMATCH • '+new Date().toLocaleTimeString('sq-AL')}catch(e){$('status').textContent=mode==='live'?'LIVE • Feed offline':'Feed error'}}
function applyLiveCoefs(payload){if(!payload||payload.game_id==null)return;const g=cache.find(x=>String(x.id)===String(payload.game_id));if(!g)return;const map={};(payload.coefs||[]).forEach(c=>{map[String(c.coef_id)]=String(c.odd)});if(typeof g.odd==='string'){g.odd=g.odd.split(',').map(part=>{const p=part.split('|');if(p.length>=4&&map[String(p[0])]!==undefined)p[1]=map[String(p[0])];return p.join('|')}).join(',')}if(payload.current_result!=null)g.result=payload.current_result;renderLive(cache);renderSlip()}
function applyLiveGame(payload){if(!payload)return;const item=payload.game||payload;if(Array.isArray(item)){item.forEach(applyLiveGame);return}if(item.id==null)return;const i=cache.findIndex(x=>String(x.id)===String(item.id));if(i<0)cache.push(item);else cache[i]={...cache[i],...item};syncLiveClock(item);renderLive(cache);renderSlip()}
function startLiveStream(){if(liveStream){try{liveStream.close()}catch(_){}}liveStream=new EventSource('/api/live-stream');liveStream.onopen=()=>{$('status').textContent='LIVE • Real-time'};liveStream.addEventListener('status',e=>{try{const d=JSON.parse(e.data);$('status').textContent=d.status==='connected'?'LIVE • Real-time':(d.status==='reconnecting'?'LIVE • Feed offline':'LIVE • Connecting…')}catch(_){}});liveStream.addEventListener('coefs',e=>{try{applyLiveCoefs(JSON.parse(e.data))}catch(_){}});liveStream.addEventListener('game',e=>{try{applyLiveGame(JSON.parse(e.data))}catch(_){}});liveStream.onerror=()=>{$('status').textContent='LIVE • Feed offline'}}
function stopLiveStream(){if(liveStream){try{liveStream.close()}catch(_){}}liveStream=null}
function setMode(m,{fromHash=false}={}){mode=m;activeLeague='';lastOdds={};selectedSport='soccer';query='';if(!fromHash)setHashForMode(m);$('homeBtn').classList.toggle('active',m==='home');$('liveBtn').classList.toggle('active',m==='live');document.body.classList.toggle('live-page',m==='live');document.querySelectorAll('.sideTool').forEach((b,i)=>b.classList.toggle('active',m==='live'?i===1:i===0));clearInterval(timer);stopLiveStream();clearInterval(window.liveClockTicker);window.liveClockTicker=null;if(m==='live'){$('sportsbar').innerHTML=[['⚽','Futboll','soccer'],['🏀','Basketboll','basketball'],['🎾','Tenis','tennis'],['🏈','Futboll Amerikan','american'],['🏸','Badminton','badminton']].map(s=>`<button class="sport ${s[2]==='soccer'?'active':''}" data-sport="${s[2]}"><span class="ico">${s[0]}</span><span>${s[1]}</span></button>`).join('');document.querySelectorAll('.sport').forEach(b=>b.onclick=()=>{document.querySelectorAll('.sport').forEach(x=>x.classList.remove('active'));b.classList.add('active');selectedSport=b.dataset.sport;renderLive(cache)});load().then(startLiveStream);window.liveClockTicker=setInterval(tickLiveClocks,1000)}else{$('sportsbar').innerHTML=sports.map(s=>`<button class="sport ${s[2]==='soccer'?'active':''}" data-sport="${s[2]}"><span class="ico">${s[0]}</span><span>${s[1]}</span></button>`).join('');document.querySelectorAll('.sport').forEach(b=>b.onclick=()=>{document.querySelectorAll('.sport').forEach(x=>x.classList.remove('active'));b.classList.add('active');selectedSport=b.dataset.sport;activeLeague='';$('leagueFilter').value='';render(cache,false)});load();timer=setInterval(load,15000)}}


function staffRoleLabel(role){return ({center:'Qendra',operator:'Operator',admin:'Admin',supermanager:'Supermanager',agent:'Agent'})[role]||role}
function staffCreateRoles(role){return ({center:[['operator','Operator']],operator:[['admin','Admin']],admin:[['supermanager','Supermanager']],supermanager:[['agent','Agent']],agent:[['user','User']]}[role]||[])}
function staffAccountLabel(role){return ({center:'Numri i qendrës',operator:'Numri i operatorit',admin:'Numri i adminit',supermanager:'Numri i supermanagerit',agent:'Numri i agjentit'})[role]||'Numri'}
function setAuthState(u){
  user=u;
  if(token)sessionStorage.setItem('sportsbook_token',token);else sessionStorage.removeItem('sportsbook_token');
  if(user){
    if(['partner','admin'].includes(user.role)){location.replace('/backoffice.html#/dashboard');return;}
    if(user.role==='center'){
      hideUserMenu();
      $('actions').innerHTML='<div class="account"><button id="panelB" class="staffAccountButton">Control Center</button></div>';
      $('panelB').onclick=()=>showCenterDashboard();
      $('slipHead').style.display='none';$('slipView').style.display='none';$('staffView').style.display='none';
      showCenterDashboard();renderSlip();return;
    }
    const staff=user.role!=='user';
    if(staff){
      hideUserMenu();
      $('actions').innerHTML='<div class="account"><button id="panelB" class="staffAccountButton">Partner</button></div>';
      $('panelB').onclick=()=>toggleStaffMenu(true);
      $('slipHead').style.display='none';$('slipView').style.display='none';$('staffView').style.display='block';toggleStaffMenu(true);
    }else{
      $('actions').innerHTML=`<div class="account userAccount"><div class="balance">Credit: <b>€${Number(user.balance).toFixed(2)}</b></div><button id="userAvatar" class="userAvatar" aria-label="Hap menunë e llogarisë">◯</button></div>`;
      $('slipHead').style.display='flex';$('slipView').style.display='block';$('staffView').style.display='none';
      $('userAvatar').onclick=e=>{e.stopPropagation();toggleUserMenu()};
    }
  }else{
    hideCenterDashboard();
    hideUserMenu();
    $('actions').innerHTML='<button id="loginB">Log In</button>';$('loginB').onclick=openAuth;
    $('slipHead').style.display='flex';$('slipView').style.display='block';$('staffView').style.display='none';
  }
  renderSlip();
}
function hideUserMenu(){const menu=$('userMenu');if(menu){menu.classList.remove('show');menu.setAttribute('aria-hidden','true')}}
function toggleUserMenu(){
  if(!user||user.role!=='user')return;
  const menu=$('userMenu'),open=!menu.classList.contains('show');
  if(!open){hideUserMenu();return}
  menu.innerHTML=`<div class="userMenuHead"><b>${esc(user.username)}</b><strong>${Number(user.balance||0).toFixed(2)}</strong><em>EUR</em></div><button data-user-menu="chat">Chat</button><button data-user-menu="rules">Rregullore</button><button data-user-menu="bets">My Bets</button><button data-user-menu="finance">Financa</button><button data-user-menu="password">Ndrysho Fjalëkalimin</button><button data-user-menu="logout">Largohu</button>`;
  menu.classList.add('show');menu.setAttribute('aria-hidden','false');

async function placeBet(){
  if(!slip.length)return;if(!user){openAuth('login');return}
  // Do not re-read the browser cache immediately before submission. The source
  // Bet Slip submits the coefficient captured at click time. Live/feed validation
  // is authoritative on the server and any invalid selection is returned there.
  if(slip.some(x=>!Number.isFinite(Number(x.odd))||Number(x.odd)<=1)){renderSlip();return}
  const stake=Number($('stake').value);if(!Number.isFinite(stake)||stake<.01){$('betMsg').textContent='Enter a valid stake.';$('betMsg').className='notice error';return}
  try{const r=await fetch('/api/bets',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({stake,selections:slip.map(p=>({gameId:p.gameId,league:p.league,home:p.home,away:p.away,market:'Fulltime Result',selection:p.key,odd:p.odd,eventTime:p.eventTime}))})});const d=await SportsbookApi.readJson(r);if(!r.ok){if(Array.isArray(d.invalidSelections)){for(const inv of d.invalidSelections){const p=slip.find(x=>String(x.gameId)===String(inv.gameId)&&String(x.key)===String(inv.selection));if(p){p.invalid=true;p.invalidReason=inv.reason||'Koeficienti nuk është aktiv.'}}renderSlip()}throw Error(d.error||'Bet could not be placed.')}user.balance=d.balance;user.reservedBalance=d.reservedBalance||0;pendingTicket={id:d.betId,stake,odds:d.totalOdds,selections:slip.map(p=>({...p}))};slip=[];$('stake').value='';setAuthState(user);$('betMsg').textContent=`Biletë #${d.betId} u dërgua në Qendër dhe është në pritje të pranimit.`;$('betMsg').className='notice ok';renderSlip();pollPendingTicket(d.betId)}catch(e){$('betMsg').textContent=e.message;$('betMsg').className='notice error'}
}

let pendingPoll=null;async function pollPendingTicket(id){if(pendingPoll)clearInterval(pendingPoll);const check=async()=>{if(!user||!pendingTicket||pendingTicket.id!==id)return;try{const r=await fetch('/api/my-bets/'+id,{headers:{Authorization:'Bearer '+token}});if(!r.ok)return;const d=await SportsbookApi.readJson(r);const st=d.bet.status;if(st!=='pending'){pendingTicket=null;if(st==='accepted'||st==='cancelled'){const mr=await fetch('/api/me',{headers:{Authorization:'Bearer '+token}});if(mr.ok)user=(await SportsbookApi.readJson(mr)).user;setAuthState(user)}if(st==='accepted')$('betMsg').textContent=`Biletë #${id} u pranua nga Qendra.`;else if(st==='cancelled')$('betMsg').textContent=`Biletë #${id} u anulua nga Qendra.`;$('betMsg').className='notice '+(st==='accepted'?'ok':'error');renderSlip();clearInterval(pendingPoll);pendingPoll=null}}catch(_){}};await check();pendingPoll=setInterval(check,2500)}

async function handleStaffAction(action){
  if(action==='logout'){await logout();return}
  if(action==='chat'){alert('Chat do të lidhet me modulin e komunikimit.');return}
  if(action==='rules'){alert('Rregullorja e platformës.');return}
  if(action==='directory'){openControl(user.role,'directory');return}
  if(action==='finance'){if(user.role==='center')return;openControl(user.role,'finance');return}
  if(action==='tickets'){openControl(user.role,'tickets');return}
  if(action==='password'){openControl(user.role,'password');return}
  if(action.startsWith('create:')){openControl(user.role,'create',action.split(':')[1]);return}
}

function ticketTable(tickets,showAccept){return `<div class="controlSection"><h3>Biletat në Qendër</h3>${tickets.length?`<table class="controlTable"><thead><tr><th>#</th><th>User</th><th>Hierarkia</th><th>Selections</th><th>Stake</th><th>Odds</th><th>Potential</th><th>Action</th></tr></thead><tbody>${tickets.map(b=>`<tr class="${b.status==='pending'?'ticketPending':'ticketAccepted'}"><td>#${b.id}<div class="ticketDetails">${new Date(b.created_at+'Z').toLocaleString('sq-AL')}</div></td><td>${esc(b.username||'')}</td><td>${esc(b.agent_username||'')}<br>${esc(b.supermanager_username||'')}</td><td>${b.selections.map(s=>`${esc(s.home)} - ${esc(s.away)} · ${esc(s.selection)} @ ${Number(s.odd).toFixed(2)}`).join('<br>')}</td><td>€${b.stake.toFixed(2)}</td><td>${b.total_odds.toFixed(2)}</td><td>€${b.potential_win.toFixed(2)}</td><td><div class="ticketActions">${b.status==='pending'?`<button data-ticket-action="accept" data-ticket="${b.id}">Prano</button>`:''}${b.status==='accepted'?`<button data-ticket-action="won" data-ticket="${b.id}">Fituese</button><button class="lost" data-ticket-action="lost" data-ticket="${b.id}">Humbese</button>`:''}${['pending','accepted'].includes(b.status)?`<button class="cancel" data-ticket-action="cancel" data-ticket="${b.id}">Refuzo / Anullo</button>`:''}</div></td></tr>`).join('')}</tbody></table>`:'<div class="noBets">Nuk ka bileta në pritje.</div>'}</div>`}
async function renderOperatorControl(silent=false){const d=await controlFetch('/api/operator/tickets');$('controlApp').innerHTML=`<div class="controlTabs"><button class="active">Biletat</button><span style="margin-left:auto;padding:10px;color:#666">${d.tickets.filter(x=>x.status==='pending').length} në pritje</span></div>${ticketTable(d.tickets,true)}`;document.querySelectorAll('[data-ticket-action]').forEach(b=>b.onclick=async()=>{const id=b.dataset.ticket,action=b.dataset.ticketAction;try{if(action==='accept')await controlFetch('/api/operator/tickets/'+id+'/accept',{method:'POST'});else if(action==='cancel')await controlFetch('/api/operator/tickets/'+id+'/cancel',{method:'POST'});else await controlFetch('/api/operator/tickets/'+id+'/settle',{method:'POST',body:JSON.stringify({status:action})});await renderOperatorControl()}catch(e){alert(e.message)}})}
function closeControlPoll(){if(controlPoll){clearInterval(controlPoll);controlPoll=null}}

function hideCenterDashboard(){document.getElementById('centerDashboard')?.remove();}
function showCenterDashboard(){if(user?.role==='center')location.replace('/backoffice.html#/dashboard');}

$('authForm').onsubmit=authSubmit;$('slipTab').onclick=()=>{if(user&&user.role!=='user')toggleStaffMenu(true);else showMyBets(false)};$('myTopBtn').onclick=()=>{if(user)showMyBets(true);else openAuth()};$('place').onclick=placeBet;$('stake').oninput=updatePotential;$('mobileSlipBar').onclick=()=>{if(slip.length){$('betslip').classList.add('mobile-open');$('mobileSlipBackdrop').classList.add('show')}};$('slipClose').onclick=()=>{$('betslip').classList.remove('mobile-open');$('mobileSlipBackdrop').classList.remove('show')};$('mobileSlipBackdrop').onclick=()=>{$('betslip').classList.remove('mobile-open');$('mobileSlipBackdrop').classList.remove('show')};document.querySelectorAll('[data-stake]').forEach(b=>b.onclick=()=>{$('stake').value=b.dataset.stake;updatePotential()});$('search').oninput=e=>{query=e.target.value.toLowerCase().trim();render(cache,false)};$('leagueFilter').onchange=e=>{activeLeague=e.target.value;render(cache,false)};$('homeBtn').onclick=()=>showMyBets(false);$('liveBtn').onclick=()=>{showMyBets(false);setMode('live')};document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{const id=b.dataset.close;$(id).classList.remove('show');if(id==='controlModal')closeControlPoll()});document.addEventListener('click',e=>{const menu=$('userMenu'),avatar=$('userAvatar');if(menu&&menu.classList.contains('show')&&!menu.contains(e.target)&&e.target!==avatar)hideUserMenu()});document.addEventListener('keydown',e=>{if(e.key==='Escape')hideUserMenu()});
setAuthState(user);window.addEventListener('hashchange',()=>setMode(modeFromHash(),{fromHash:true}));setMode(modeFromHash(),{fromHash:true});restore();renderSlip();
